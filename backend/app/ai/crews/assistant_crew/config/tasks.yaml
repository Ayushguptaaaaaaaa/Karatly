answer_question:
  description: >
    Today is {today}. You are talking to the {user_role}.

    Shop snapshot with exact, up-to-date numbers (JSON): {shop_snapshot}

    Recent conversation:
    {chat_history}

    Question: {question}

    Answer directly from the snapshot whenever it holds the answer. That covers today's sales and
    profit, this month's KPIs, profit by category, subcategory and design, sold-out and low designs,
    the restock suggestion and budget, dead stock and the 6-month trend. Do NOT call a tool for data
    that is already in the snapshot. Use a tool only for something it does not contain, such as
    another day, month or quarter, or one specific label's history. Follow your answering guidelines.
  expected_output: >
    JSON matching ChatAnswer: answer_markdown (markdown text), optional table (columns, rows),
    optional chart (type bar/line/pie, title, data of label/value, value_format number or inr),
    follow_up_questions (max 3).
  agent: accountant_assistant
